name: CryoSPARC (RHEL9)
category: Interactive Apps
subcategory: Compute Node Jobs
role: batch_connect
description: |
  Starts CryoSPARC with 1 worker and 1 or more GPUs.  
  The worker can utilize all the GPUs that you request.

  At the CryoSPARC login page:

   * Your username is `<PACE username>@gatech.edu`.  For example, `gburdell3@gatech.edu`
   * Your password is your CryoSPARC license ID

  During the session, you can navigate backwards and forwards in the session's
  browser with Alt + 🠈 and Alt + 🠊.  